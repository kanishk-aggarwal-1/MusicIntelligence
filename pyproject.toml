# Tooling configuration for the Python backend.
# Ruff handles both linting and formatting (Black-compatible). No build-system
# section: the project ships via requirements.txt, this file is tooling-only.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "alembic/versions",  # frozen migration history — never reformat
    "frontend",
    "**/__pycache__",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (catches unused imports/vars), I: import sorting.
# E501 (line length) is owned by the formatter, so it's disabled here.
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
