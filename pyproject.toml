# Tooling configuration for the Python backend.
# Ruff handles both linting and formatting (Black-compatible). No build-system
# section: the project ships via requirements.txt, this file is tooling-only.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "alembic/versions",  # frozen migration history — never reformat
    "frontend",
    "**/__pycache__",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (catches unused imports/vars), I: import sorting.
# E501 (line length) is owned by the formatter, so it's disabled here.
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These modules import model classes purely for their side effect: registering
# tables with SQLAlchemy's Base.metadata before create_all() runs. They look
# unused to the linter but are load-bearing — never remove them.
"backend/app/main.py" = ["F401"]
"backend/app/models/__init__.py" = ["F401"]
"create_tables.py" = ["F401"]
# Standalone scripts adjust sys.path before importing, so imports aren't at top.
"backend/seed_demo.py" = ["E402"]
# Alembic env boilerplate imports after configuring the migration context.
"alembic/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
